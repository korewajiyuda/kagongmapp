<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경희대 요정 맵 - 카공맵</title>
    <!-- 폰트 적용 (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary-blue: #7E9DFF;
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-sub: #777777;
            --border-color: #EAEAEA;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: #E5E5E5;
            display: flex;
            justify-content: center;
        }

        /* 모바일 화면 컨테이너 */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* 상단 검색 및 필터 영역 */
        .top-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border-radius: 30px;
            padding: 12px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }

        .search-bar input {
            border: none;
            outline: none;
            font-size: 15px;
            font-family: 'Pretendard';
            flex-grow: 1;
            margin-left: 10px;
        }

        .search-bar .fairy-icon {
            font-size: 20px;
        }

        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-scroll::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        /* 중간 지도 영역 */
        .map-area {
            flex-grow: 1;
            background-color: #E2EED9;
            background-image: url('https://www.transparenttextures.com/patterns/cartographer.png');
            position: relative;
        }

        /* 맵 핀 */
        .map-pin {
            position: absolute;
            background: var(--card-bg);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            color: var(--primary-blue);
        }
        .pin-1 { top: 40%; left: 30%; }
        .pin-2 { top: 50%; left: 60%; }
        .pin-3 { top: 30%; left: 70%; }

        /* 하단 바텀 시트 */
        .bottom-sheet {
            background: var(--card-bg);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            height: 55%;
            position: absolute;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .drag-handle {
            width: 40px;
            height: 4px;
            background: #D1D1D1;
            border-radius: 2px;
            margin: 0 auto 15px auto;
        }

        .sheet-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
        }

        .cafe-list {
            overflow-y: auto;
            flex-grow: 1;
            padding-bottom: 80px;
        }

        .cafe-list::-webkit-scrollbar {
            display: none;
        }

        /* 카페 카드 UI */
        .cafe-card {
            display: flex;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
            gap: 15px;
        }

        .cafe-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background-color: #EEE;
            object-fit: cover;
        }

        .cafe-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cafe-name {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 5px 0;
            color: var(--text-main);
        }

        .cafe-tags {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .cafe-review {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* 하단 고정 CTA 버튼 */
        .cta-btn-wrapper {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 30;
        }

        .cta-btn {
            background: linear-gradient(135deg, #7E9DFF, #A1B8FF);
            color: white;
            border: none;
            border-radius: 16px;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(126, 157, 255, 0.4);
            font-family: 'Pretendard';
            transition: transform 0.2s;
        }

        .cta-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="top-section">
            <div class="search-bar">
                <span class="fairy-icon">🧚</span>
                <input type="text" placeholder="어디서 공부할까? 요정의 추천!">
                <span>🔍</span>
            </div>
            <div class="filter-scroll">
                <div class="filter-chip">🔌 콘센트 많음</div>
                <div class="filter-chip">🔇 조용한</div>
                <div class="filter-chip">☕ 대형 카페</div>
                <div class="filter-chip">🕒 24시간</div>
            </div>
        </div>

        <div class="map-area">
            <div class="map-pin pin-1">🧚 8번가</div>
            <div class="map-pin pin-2">🧚 라흐씨</div>
            <div class="map-pin pin-3">🧚 ALGO</div>
        </div>

        <div class="bottom-sheet">
            <div class="drag-handle"></div>
            <div class="sheet-title">🧚 요정이 해결해 주는 경희대 카공맵 📚</div>
            
            <div class="cafe-list">
                <div class="cafe-card">
                    <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=200&q=80" alt="8번가" class="cafe-image">
                    <div class="cafe-info">
                        <h3 class="cafe-name">8번가</h3>
                        <div class="cafe-tags">⭐ 4.8 · 🔌 콘센트 많음 · 🪑 3층 규모 대형</div>
                        <div class="cafe-review">"널찍한 사각 테이블과 잔잔한 음악, 팀플하기도 최고!"</div>
                    </div>
                </div>

                <div class="cafe-card">
                    <img src="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=200&q=80" alt="ALGO COFFEE" class="cafe-image">
                    <div class="cafe-info">
                        <h3 class="cafe-name">ALGO COFFEE</h3>
                        <div class="cafe-tags">⭐ 4.6 · 🔌 콘센트 완비 · ☕ 커피 맛집</div>
                        <div class="cafe-review">"지하 1층의 비밀 아지트 같은 쾌적한 카공 명당"</div>
                    </div>
                </div>

                <div class="cafe-card">
                    <img src="https://images.unsplash.com/photo-1481833761820-0509d3217092?auto=format&fit=crop&w=200&q=80" alt="라흐씨의 작업실" class="cafe-image">
                    <div class="cafe-info">
                        <h3 class="cafe-name">라흐씨의 작업실</h3>
                        <div class="cafe-tags">⭐ 4.9 · 🤫 조용함 · 🪵 포근한 아지트</div>
                        <div class="cafe-review">"노트북 타이핑도 눈치 안 보고 집중할 수 있는 고즈넉함"</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="cta-btn-wrapper">
            <button class="cta-btn" onclick="alert('DM으로 받은 Gemini 프롬프트 창으로 이동합니다!')">
                🧚 요정에게 맞춤형 공간 추천받기 (Gemini)
            </button>
        </div>
    </div>

</body>
</html>
